services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:16-alpine
    container_name: expenseflow_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-expenseflow_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-expenseflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - expenseflow_network

  # 2. FastAPI Python Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: expenseflow_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-expenseflow_db}
      SECRET_KEY: ${SECRET_KEY:-supersecretkey-expenseflow-fintech-jwt-token-2026-production-grade}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ORIGINS: '["*"]'
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - expenseflow_network

  # 3. Nginx Reverse Proxy & Frontend Host
  nginx:
    image: nginx:alpine
    container_name: expenseflow_nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
    networks:
      - expenseflow_network

volumes:
  postgres_data:
    driver: local

networks:
  expenseflow_network:
    driver: bridge

